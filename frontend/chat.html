<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 智能问答 - 知识库管理平台</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* 布局：上导航 + 左会话列表 + 右对话区 */
    .main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    /* 左侧会话列表 */
    .sidebar {
      width: 240px;
      background: #fff;
      border-right: 1px solid #e8e8e8;
      display: flex;
      flex-direction: column;
    }
    .sidebar .new-chat {
      margin: 12px;
    }
    .sidebar .session-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px;
    }
    .session-item {
      padding: 10px 12px;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 4px;
      color: #555;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .session-item:hover {
      background: #f0f4ff;
    }
    .session-item.active {
      background: #1a73e8;
      color: #fff;
    }
    /* 右侧对话区 */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #f5f7fa;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .message {
      margin-bottom: 16px;
      display: flex;
    }
    .message.user {
      justify-content: flex-end;
    }
    .message .bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 8px;
      line-height: 1.6;
      word-break: break-word;
    }
    .message.user .bubble {
      background: #1a73e8;
      color: #fff;
    }
    .message.assistant .bubble {
      background: #fff;
      border: 1px solid #e8e8e8;
      white-space: pre-wrap;
    }
    .message .meta-tag {
      display: block;
      font-size: 12px;
      color: #ff9800;
      margin-top: 6px;
    }
    /* 输入区 */
    .input-area {
      background: #fff;
      border-top: 1px solid #e8e8e8;
      padding: 12px 20px;
      display: flex;
      gap: 12px;
    }
    .input-area textarea {
      flex: 1;
      min-height: 48px;
      max-height: 120px;
      resize: none;
    }
    .input-area .btn {
      align-self: flex-end;
      height: 40px;
    }
  </style>
</head>
<body>
  <!-- 顶部导航 -->
  <div class="navbar">
    <div class="brand">知识库管理平台</div>
    <div class="menu">
      <a href="index.html">首页</a>
      <a href="chat.html" class="active">AI 问答</a>
    </div>
    <div class="user-info">
      <span id="userName"></span>
      <button class="btn btn-sm" onclick="logout()">退出登录</button>
    </div>
  </div>

  <div class="main">
    <!-- 左侧会话列表 -->
    <div class="sidebar">
      <div class="new-chat">
        <button class="btn btn-primary" style="width:100%" onclick="newChat()">+ 新建对话</button>
      </div>
      <div class="session-list" id="sessionList"></div>
    </div>

    <!-- 右侧对话区 -->
    <div class="chat-area">
      <div class="messages" id="messages"></div>
      <div class="input-area">
        <textarea id="question" placeholder="请输入您的问题，回车发送（Shift+回车换行）"></textarea>
        <button class="btn btn-primary" id="sendBtn" onclick="send()">发送</button>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>
    // ===== 登录态守卫 =====
    if (!requireLogin()) {}

    const userInfo = getUserInfo();
    if (userInfo) {
      document.getElementById('userName').textContent = userInfo.display_name || userInfo.username;
    }

    let currentSessionId = null; // 当前会话 ID

    // ===== 渲染会话列表 =====
    async function loadSessions() {
      try {
        const data = await http.get('/ai/sessions');
        const list = document.getElementById('sessionList');
        list.innerHTML = '';
        if (!data.items || data.items.length === 0) {
          list.innerHTML = '<div class="empty">暂无历史会话</div>';
          return;
        }
        data.items.forEach((s) => {
          const div = document.createElement('div');
          div.className = 'session-item' + (s.session_id === currentSessionId ? ' active' : '');
          div.textContent = '会话 ' + (s.session_id || '').slice(0, 8);
          div.onclick = () => openSession(s.session_id);
          list.appendChild(div);
        });
      } catch (e) {
        // 会话列表加载失败不阻塞主流程
      }
    }

    // ===== 打开历史会话 =====
    async function openSession(sessionId) {
      currentSessionId = sessionId;
      const messages = document.getElementById('messages');
      messages.innerHTML = '';
      try {
        const data = await http.get(`/ai/sessions/${sessionId}/messages`);
        (data || []).forEach((m) => {
          appendMessage(m.role, m.content, null);
        });
      } catch (e) {
        toast('加载历史消息失败', 'error');
      }
      loadSessions();
    }

    // ===== 新建对话 =====
    function newChat() {
      currentSessionId = null;
      document.getElementById('messages').innerHTML = '';
      loadSessions();
    }

    // ===== 追加消息到界面 =====
    function appendMessage(role, content, extra) {
      const messages = document.getElementById('messages');
      const div = document.createElement('div');
      div.className = 'message ' + role;
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = content;
      div.appendChild(bubble);
      if (extra) {
        const tag = document.createElement('span');
        tag.className = 'meta-tag';
        tag.textContent = extra;
        bubble.appendChild(tag);
      }
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return bubble;
    }

    // ===== 发送提问 =====
    async function send() {
      const questionEl = document.getElementById('question');
      const question = questionEl.value.trim();
      if (!question) return;

      // 显示用户消息
      appendMessage('user', question);

      // 创建助手消息气泡（用于流式追加）
      const assistantBubble = appendMessage('assistant', '');

      questionEl.value = '';
      document.getElementById('sendBtn').disabled = true;

      try {
        const token = getToken();
        const resp = await fetch(BASE_URL + '/ai/chat/stream', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify({ question, session_id: currentSessionId }),
        });

        if (resp.status === 401) {
          toast('登录已过期，请重新登录', 'error');
          setTimeout(() => (location.href = 'login.html'), 800);
          return;
        }
        if (!resp.ok) {
          assistantBubble.textContent = '请求失败，请稍后重试';
          return;
        }

        // 解析 SSE 流
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let answerText = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const events = buffer.split('\n\n');
          buffer = events.pop(); // 保留不完整的事件

          for (const evt of events) {
            const lines = evt.split('\n');
            const eventLine = lines.find((l) => l.startsWith('event:'));
            const dataLine = lines.find((l) => l.startsWith('data:'));
            if (!eventLine || !dataLine) continue;

            const event = eventLine.replace('event:', '').trim();
            let data;
            try {
              data = JSON.parse(dataLine.replace('data:', '').trim());
            } catch (e) {
              continue;
            }

            if (event === 'meta') {
              // 记录会话 ID，供多轮对话
              if (data.session_id) {
                currentSessionId = data.session_id;
              }
              // 权限缺失提示
              if (data.unauthorized && data.unauthorized.length > 0) {
                const tag = document.createElement('span');
                tag.className = 'meta-tag';
                tag.textContent = `⚠️ 部分知识单元（ID: ${data.unauthorized.join(', ')}）无访问权限`;
                assistantBubble.appendChild(tag);
              }
              // 兜底标识
              if (data.used_fallback) {
                const tag = document.createElement('span');
                tag.className = 'meta-tag';
                tag.textContent = '（未基于知识库回答）';
                assistantBubble.appendChild(tag);
              }
            } else if (event === 'delta') {
              answerText += data.content || '';
              assistantBubble.textContent = answerText;
              document.getElementById('messages').scrollTop =
                document.getElementById('messages').scrollHeight;
            } else if (event === 'done') {
              // 流式结束
            }
          }
        }

        // 刷新会话列表
        loadSessions();
      } catch (err) {
        assistantBubble.textContent = '网络错误，请检查后端服务';
      } finally {
        document.getElementById('sendBtn').disabled = false;
      }
    }

    // ===== 键盘事件：回车发送，Shift+回车换行 =====
    document.getElementById('question').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    // ===== 初始化 =====
    loadSessions();
  </script>
</body>
</html>
